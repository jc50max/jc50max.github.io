plugins { id 'com.android.application' }

def twaHost = project.findProperty('twaHost') ?: 'pain-dur.example.fr'
def ksFile  = System.getenv('KEYSTORE_FILE')

android {
    namespace 'com.paindur.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.paindur.app'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '3.0'

        manifestPlaceholders = [hostName: twaHost]
        resValue 'string', 'launchUrl', "https://${twaHost}/"
        resValue 'string', 'assetStatements',
            '[{ \\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"],' +
            ' \\"target\\": {\\"namespace\\": \\"web\\", \\"site\\": \\"https://' + twaHost + '\\"}}]'
    }

    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksFile) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.4.0'
}
