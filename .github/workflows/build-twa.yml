name: 3 - Compiler l'APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-twa.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurer la clé de signature
        id: ks
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret KEYSTORE_B64 absent : APK de debug, assetlinks ne pourra pas être validé."
          fi

      - name: Compiler
        env:
          KEYSTORE_FILE: ${{ steps.ks.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TWA_HOST: ${{ vars.TWA_HOST }}
          OWNER: ${{ github.repository_owner }}
        run: |
          HOST="${TWA_HOST:-${OWNER,,}.github.io}"
          echo "Domaine de l'appli : $HOST" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$KEYSTORE_FILE" ]; then
            gradle :app:assembleRelease :app:bundleRelease -PtwaHost="$HOST" --no-daemon
          else
            gradle :app:assembleDebug -PtwaHost="$HOST" --no-daemon
          fi

      - name: Empreinte SHA-256 pour assetlinks.json
        if: steps.ks.outputs.file != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" | grep 'SHA256:' | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: pain-dur-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
