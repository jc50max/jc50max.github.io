name: 2 - Créer la clé de signature

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Générer la clé
        run: |
          mkdir out && cd out
          PASS=$(openssl rand -base64 24 | tr -d '/+=' | cut -c1-24)
          keytool -genkeypair -keystore pain-dur.jks -alias paindur \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Pain Dur" -storepass "$PASS" -keypass "$PASS" -noprompt
          base64 -w0 pain-dur.jks > KEYSTORE_B64.txt
          {
            echo "Secrets à créer (Settings > Secrets and variables > Actions) :"
            echo
            echo "KEYSTORE_B64      = tout le contenu du fichier KEYSTORE_B64.txt"
            echo "KEYSTORE_PASSWORD = $PASS"
            echo "KEY_ALIAS         = paindur"
            echo "KEY_PASSWORD      = $PASS"
            echo
            echo "Conserver pain-dur.jks et ce mot de passe en lieu sûr, hors de GitHub."
          } > LISEZ-MOI.txt

      - uses: actions/upload-artifact@v4
        with:
          name: cle-pain-dur
          path: out/
          retention-days: 1
